      <stop stop-color="#527d79"/><stop offset=".3" stop-color="#294d52"/><stop offset=".65" stop-color="#172d38"/><stop offset="1" stop-color="#0e1926"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2=".4">
      <stop stop-color="#162c35"/><stop offset=".5" stop-color="#52716c"/><stop offset=".66" stop-color="#345852"/><stop offset="1" stop-color="#142833"/>
    </linearGradient>
    <linearGradient id="hood" x1=".1" y1=".1" x2=".85" y2=".9">
      <stop stop-color="#e5d9b5"/><stop offset=".32" stop-color="#a9b49c"/><stop offset=".63" stop-color="#537c78"/><stop offset="1" stop-color="#29434b"/>
