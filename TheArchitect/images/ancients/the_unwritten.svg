<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400">
  <title>The Unwritten — Patron of Imperfection</title>
  <desc>An ancient mender of possibilities. A crooked ivory hood frames a cracked, kindly mask and one amber eye. Her teal and oxblood vestments unravel into loose gold threads; a bent needle and an offered orange pearl defy the Architect's perfect design. Original vector character illustration, transparent background.</desc>
