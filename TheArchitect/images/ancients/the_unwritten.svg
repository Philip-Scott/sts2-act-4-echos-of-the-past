    </linearGradient>
    <linearGradient id="lining" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#201f2b"/><stop offset=".5" stop-color="#523c44"/><stop offset="1" stop-color="#121e29"/>
    </linearGradient>
    <radialGradient id="pearl" cx=".35" cy=".28" r=".78">
