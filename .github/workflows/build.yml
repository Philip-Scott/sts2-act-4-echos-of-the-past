name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_VERSION: "9.0.x"
  GODOT_VERSION: "4.5.1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate mod manifest
        run: python3 scripts/validate_manifest.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # sts2.dll and 0Harmony.dll ship with the game and cannot be committed here.
      # Set the STS2_ASSEMBLIES_URL secret to a zip archive containing them (or containing
      # API stubs with the same public surface) to enable compilation in CI.
      - name: Fetch Slay the Spire 2 assemblies
        id: assemblies
        env:
          STS2_ASSEMBLIES_URL: ${{ secrets.STS2_ASSEMBLIES_URL }}
        run: |
          if [ -z "$STS2_ASSEMBLIES_URL" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::STS2_ASSEMBLIES_URL secret is not set; skipping compilation."
            exit 0
          fi
          mkdir -p ci/sts2-data
          curl -fsSL "$STS2_ASSEMBLIES_URL" -o /tmp/sts2-data.zip
          unzip -q -j /tmp/sts2-data.zip -d ci/sts2-data
          for dll in sts2.dll 0Harmony.dll; do
            if [ ! -f "ci/sts2-data/$dll" ]; then
              echo "::error::$dll missing from the archive downloaded from STS2_ASSEMBLIES_URL"
              exit 1
            fi
          done
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Setup Godot
        if: steps.assemblies.outputs.available == 'true'
        run: |
          dir="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${dir}.zip"
          unzip -q /tmp/godot.zip -d "$RUNNER_TEMP"
          bin="$RUNNER_TEMP/$dir/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          chmod +x "$bin"
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"

      - name: Build mod
        if: steps.assemblies.outputs.available == 'true'
        run: |
          scripts/build.sh \
            --configuration Release \
            --sts2-data-dir "$GITHUB_WORKSPACE/ci/sts2-data" \
            --mods-path "$GITHUB_WORKSPACE/artifacts/mods" \
            --godot "$GODOT_BIN" \
            --publish

      - name: Upload mod
        if: steps.assemblies.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TheArchitect
          path: artifacts/mods/

  docker:
    name: Build environment image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sts2-the-architect-build .
